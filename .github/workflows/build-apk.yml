name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK (build artifact, requires GitHub login to download)
        uses: actions/upload-artifact@v4
        with:
          name: TeachPro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Only runs when you push a version tag (e.g. `git tag v1.1 && git push
      # origin v1.1`). This publishes the APK as a public GitHub Release
      # asset -- anyone can download it directly, no GitHub account needed.
      # This is the link the in-app "Update Now" button opens.
      - name: Publish GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: TeachPro ${{ github.ref_name }}
          body: Automated build for ${{ github.ref_name }}.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
